# Preparing the greet and wish workflow

name: greet and wish

on:
  push:

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Greet the user
        run: echo "Hello, Good Morning Doston"

  wish:
    needs: greet
    runs-on: ubuntu-latest
    steps:
      - name: wish the user
        run: echo "Wishing you and your family a very Happy Diwali"

  wish_back:
    needs: ["greet", "wish"]
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge
        run: echo "Wish you the same, Dost!"