# This is a practice hello yml file

# Name of the workflow
name: Hello

# when the workflow should work
on:
  workflow_dispatch:   # this means it will run when you click the "Run workflow" button in the Actions tab

# what permissions it should have
permissions:
  contents: read

# what the workflow does
jobs:
  hello:
    runs-on: ubuntu-latest    # where the job runs
    timeout-minutes: 1
    steps:
      - name: Say Hello
        run: echo "Hello Doston!"
              
  greet:
    needs: hello
    runs-on: ubuntu-latest
    steps:
      - name: Greet the user
        run: echo "Greetings from the workflow!"
