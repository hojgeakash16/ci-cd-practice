# Preparing the dummy CI/CD pipeline

name: Dummy CI/CD Pipeline

on:
  workflow_dispatch:  # this means it will run when you click the "Run workflow" button in the Actions tab

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-cd-practice
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone and checkout the repository
        uses: actions/checkout@v7

  build:
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: Build the demo project
        run: echo "Building the demo project..."

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run dummy tests
        run: echo "Running dummy tests..."

  deploy:
    needs: [code, build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the demo project
        run: echo "Deploying the demo project..."