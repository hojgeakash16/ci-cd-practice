# Preparing the dummy CI pipeline for the yml file. 

name: Dummy CI Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

  build:
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: Build the code
        run: echo "Building the code"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Running tests for the code
        run: echo "Running tests for the code"

  deploy:
    needs: ["code", "build", "test"]
    runs-on: ubuntu-latest
    steps:
      - name: Deploying the code
        run: echo "Deploying the code"



  