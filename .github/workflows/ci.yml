# Preparing the dummy CI/CD pipeline

name: Dummy CI/CD Pipeline

on:
  workflow_dispatch:  # this means it will run when you click the "Run workflow" button in the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-cd-practice
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Cloning the code..."

  build:
      needs: code
      runs-on: ubuntu-latest
      steps:
        - name: Build the code
          run: echo "Building the code..."

  test:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Run tests
          run: echo "Running tests..."

  deploy:
      needs: [code, build, test]
      runs-on: ubuntu-latest
      steps:
        - name: Deploy the code
          run: echo "Deploying the code..."
