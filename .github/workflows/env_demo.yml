# This file is for creating env variables

name: environment_variables

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  contents: read
  id-token: write

env:
  name: Akash Subhash Hojge

jobs:
  env_demo:
    runs-on: ubuntu-latest
    steps:
      - name: Print the full name
        run: echo "My name is ${{ env.name }}"

      - name: Print the Dockerhub username
        run: echo "My Dockerhub username is ${{ vars.DOCKERHUB_USERNAME }}"